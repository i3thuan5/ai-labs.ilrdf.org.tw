---
os: linux
dist: jammy
language: python
python:
  - '3.12'
before_install:
  - pip install --upgrade pip setuptools
branches:
  only:
    - main
    - CD
jobs:
  include:
    - name: Check YAML format
      install:
        - pip install tox
      script:
        - tox -e yamllint
    - name: Check Markdown Format
      install:
        - pip install tox
      script:
        - tox -e pymarkdown
    - name: Check Gherkin format
      language: node_js
      node_js: 22
      before_install: skip
      install:
        - npm install gherkin-lint
      script:
        - npx gherkin-lint
    - name: Check Python Format
      install:
        - pip install tox
      script:
        - tox -e flake8
    - name: Check Bash format
      install:
        - pip install tox
      script:
        - tox -e shellcheck
    - name: Test
      install:
        - pip install tox
      script:
        - tox -e test
    - name: Behave
      install:
        - pip install tox
      script:
        - tox -e behave
    - name: Check migrations
      install:
        - pip install tox
      script:
        - tox -e checkmigrations
    - name: Check django deploy settings
      install:
        - pip install tox
      script:
        - tox -e checkdeploy
    - stage: Integration Test
      # if: branch =~ /^(release)/
      name: Check nginx configuration
      install:
        - pip install tox
      script:
        - docker network create nginx-bridge
        - git clone https://github.com/i3thuan5/Formosan-AI.git
        - cd Formosan-AI/
        - echo ASR_VIRTUAL_HOST=localhost > .env
        - echo ASR_KALDI_VIRTUAL_HOST=localhost >> .env
        - echo TTS_VIRTUAL_HOST=localhost >> .env
        - echo MT_VIRTUAL_HOST=localhost >> .env
        - sed '/deploy/,+6d' -i deploy/docker-compose-production.yml
        - >
          docker compose -f docker-compose.yml -f deploy/docker-compose-production.yml
          up -d --quiet-pull > /dev/null
        - cd ..
        - mkdir secrets
        - cp testdata/random-key.txt secrets/django_secret_key.txt
        - cp testdata/random-key.txt secrets/postgres_passwd.txt
        - cp testdata/sentry-fake-key.txt secrets/sentry_dsn.txt
        - echo "{}" > secrets/ga_credentials.json
        - docker compose pull --quiet > /dev/null
        - docker compose build --quiet > /dev/null
        - sleep 6m
        - tox -e checknginx
      after_failure:
        - cd Formosan-AI/
        - docker compose logs
    - stage: deploy
      name: deploy
      if: (type = push or type = cron) and (branch = main or branch = CD)
      install:
        - pip install ansible
      before_script:
        - mkdir -p "${HOME}/.ssh/"
        - TRAVIS_TSUKI_SSH_KEY_PATH="${HOME}/.ssh/id_ed25519_travis"
        - echo "${DEPLOY_HOST} ssh-ed25519 ${DEPLOY_HOST_SSH_PUBLICKEY}" >> ${HOME}/.ssh/known_hosts
        - echo "${DEPLOY_HOST_USER_SSH_KEY}" | base64 --decode > "${TRAVIS_TSUKI_SSH_KEY_PATH}"
        # Recreate the certificate from the secure environment variable
        - chmod 400 "${TRAVIS_TSUKI_SSH_KEY_PATH}"
      script:
        - >
          ansible-playbook -i deploy/inventory_travis deploy/deploy.yaml
          --extra-vars "tsuanan_repo=`basename ${TRAVIS_REPO_SLUG}`"
          --extra-vars "branch=${TRAVIS_BRANCH}"
          --extra-vars "DEPLOY_HOST=${DEPLOY_HOST}"
          --extra-vars "DEPLOY_HOST_USER=${DEPLOY_HOST_USER}"
          --extra-vars "TRAVIS_TSUKI_SSH_KEY_PATH=${TRAVIS_TSUKI_SSH_KEY_PATH}"
          --extra-vars "DOCKER_USER=${DOCKER_USER}"
          --extra-vars "DOCKER_TOKEN=${DOCKER_TOKEN_PULL}"
          --extra-vars "VIRTUAL_HOST=${VIRTUAL_HOST}"
          --extra-vars "SECRET_KEY=${SECRET_KEY}"
          --extra-vars "WEB_CONCURRENCY=${WEB_CONCURRENCY}"
          --extra-vars "SENTRY_DSN=${SENTRY_DSN}"
          --extra-vars "GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID}"
          --extra-vars "GA_PROPERTY_ID=${GA_PROPERTY_ID}"
          --extra-vars "ASR_BATCH_SIZE=${ASR_BATCH_SIZE}"
          --extra-vars "ASR_VIRTUAL_HOST=${ASR_VIRTUAL_HOST}"
          --extra-vars "ASR_KALDI_VIRTUAL_HOST=${ASR_KALDI_VIRTUAL_HOST}"
          --extra-vars "TTS_VIRTUAL_HOST=${TTS_VIRTUAL_HOST}"
          --extra-vars "MT_VIRTUAL_HOST=${MT_VIRTUAL_HOST}"
