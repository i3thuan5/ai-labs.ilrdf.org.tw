{% load static %}

<figure class="sa-plate m-0">
	<button type="button" class="sa-zoom"
		data-bs-toggle="modal" data-bs-target="#sa-lightbox"
		data-sa-src="{% static src %}"
		data-sa-caption="{{ caption }}"
		aria-label="放大檢視：{{ caption }}">
		<img src="{% static src %}" alt="{{ caption }}" loading="lazy">
	</button>
	<figcaption class="sa-plate__caption">{{ caption }}</figcaption>
</figure>
