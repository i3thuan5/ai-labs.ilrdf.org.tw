{% load wagtailcore_tags %}

{% if wagtail_iah %}
<a	class="
	{% if is_dropbown %}dropdown-item{% else %}nav-link{% endif %}
	{% if page.id == wagtail_iah.id %}active disabled rounded{% endif %}
	"
	{% if page.id == wagtail_iah.id %}
	aria-current="page"	aria-disabled="true"
	{% else %}
	href="{% pageurl wagtail_iah fallback='comming_soon' %}"
	{% endif %}
>{% if iah_title %}{{iah_title}}{% else %}{{ wagtail_iah.title }}{% endif %}</a>
{% endif %}
