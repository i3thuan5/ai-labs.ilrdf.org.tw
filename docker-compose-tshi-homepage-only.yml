---
services:
  gunicorn:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: autuan.settings
    ports:
      - "8000:8000"
    volumes:
      - "./autuan:/app"

  django-static:
    volumes:
      - "./autuan:/app"

  nginx:
    networks: !override
      - nginx-bridge
      - gunicorn-bridge
