  postgres:
    image: postgres:18.0-alpine
    volumes:
      - "postgres-data:/var/lib/postgresql/18/docker"
    secrets:
      - postgres_passwd
    environment:
      POSTGRES_DB: "postgresdb_inline"
      POSTGRES_USER: "postgresuser_inline"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_passwd
    healthcheck:
      test: [ "CMD", "pg_isready","-d", "postgresdb_inline", "-U", "postgresuser_inline" ]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: always


volumes:
  postgres-data:
  # static-data:

# network:
  # enable_ipv4
  # enable_ipv6

secrets:
  postgres_passwd:
    file: ./postgres_passwd.txt
