services:
  # nginx-proxy:
  #   image:
  #   ports:
  #     - 127.0.0.1:80:80

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - 77:80
    volumes:
      - "staticfiles:/staticfiles/"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - django-gunicorn

  django-gunicorn:
    ports:
      - 3333:8000
    build: .
    secrets: &django_secrets
      - django_secret_key
      - postgres_passwd
    environment: &django_envs
      DJANGO_SECRET_KEY: /run/secrets/django_secret_key
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      POSTGRES_PASSWORD: /run/secrets/postgres_passwd
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  django-static:
    build: .
    command: python manage.py collectstatic --noinput
    restart: no
    volumes:
      - "staticfiles:/staticfiles/"
    secrets: *django_secrets
    environment: *django_envs

  postgres:
    image: postgres:18.0-alpine
    labels:
      - "backup.postgres=true"
    volumes:
      - "postgres-data:/var/lib/postgresql/18/docker"
    secrets:
      - postgres_passwd
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: /run/secrets/postgres_passwd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: "10s"
      start_interval: "1s"
      interval: "10s"
      timeout: "5s"
    restart: always


volumes:
  postgres-data:
  staticfiles:

# network:
  # enable_ipv4
  # enable_ipv6

secrets:
  postgres_passwd:
    environment: POSTGRES_PASSWD_SECRET
  django_secret_key:
    environment: DJANGO_SECRET_KEY

