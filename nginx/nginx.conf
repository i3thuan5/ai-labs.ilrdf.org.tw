upstream autuan {
    server gunicorn:8000;
}

server {
    listen 80;
    charset utf-8;
    charset_types *;
    client_header_timeout 5s;

    location /static/ {
        alias /staticfiles/;
    }
    location / {
        proxy_pass  http://autuan/;
        proxy_set_header Host  $http_host;
        client_max_body_size 7M;
    }
}
