upstream autuan {
    server gunicorn:8000;
}

server {
    listen 80;
    # client_max_body_size 7m;
    charset utf-8;

    location /static/ {
        alias /staticfiles/;
    }
    location / {
        proxy_pass  http://autuan;
        proxy_set_header Host  $http_host;
        # proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        # proxy_redirect  off;
    }
}
