upstream autuan {
    server gunicorn:8000;
}
upstream sapolita {
    server asr:7860;
}
upstream sapolita-kaldi {
    server asr-kaldi:7860;
}
upstream hnang-kari-ai-asi-sluhay {
    server tts:7860;
}
upstream kari-seejiq-tnpusu-ai-hmjil {
    server mt:7860;
}

# 安全標頭的原則：本層只補「上游沒送」的標頭，不做全域覆寫。
#
# Django 已經自行送出 X-Frame-Options、X-Content-Type-Options、
# Referrer-Policy 與 Cross-Origin-Opener-Policy，所以 location / 一條都不加，
# 加了會變成重複標頭。
#
# add_header 的繼承是全有全無：只要某個 location 自己有任何一條 add_header，
# 父層 server 的 add_header 會全部失效。因此不放 server 層，
# 改為逐 location 明確寫齊。

server {
    listen 80;
    charset utf-8;
    charset_types *;
    client_header_timeout 5s;
    location /static/ {
        alias /staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff always;
    }

    # 以下四條 AI 應用路徑與 /favicon.ico 都 proxy 到 Gradio 5.49.1。
    # Gradio 不提供設定安全標頭的方式，官方也表態不打算做
    # （gradio-app/gradio#8885，closed as not planned），只能由本層補。
    #
    # sub_filter 是為了拿掉 Gradio 內建、指向 cdnjs 的第三方 script。
    # 那支 iframeResizer.contentWindow.min.js 只在頁面被 iframe 內嵌時才有用，
    # 而本站一律以 <a href> 連往 AI 應用，Gradio 頁面上的自訂 JS
    # （remove_gradio5_iframe_issue61）甚至會主動刪掉所有 iframe，
    # 因此它在本站完全多餘。改指向同源的空檔案而非整段刪除，
    # 是為了只比對 URL 這一個明確字串，不必比對整個標籤的換行與空白。
    #
    # 本規則綁定 Gradio 5.49.1。上游從 6.17.0 起已改為自架同源，
    # AI 應用升級到該版之後，本規則會失配並成為無害的空操作，屆時應移除。
    #
    # 上游若回壓縮內容，sub_filter 比對不到字串且不會報錯，
    # 所以必須清掉 Accept-Encoding 讓上游回明文。

    location /sapolita/ {
        proxy_pass  http://sapolita$request_uri;
        proxy_set_header Host  $http_host;
        client_max_body_size 1G;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter
            'https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.contentWindow.min.js'
            '/static/js/iframe-resizer-noop.js';
    }
    location /sapolita-kaldi/ {
        proxy_pass  http://sapolita-kaldi$request_uri;
        proxy_set_header Host  $http_host;
        client_max_body_size 1G;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter
            'https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.contentWindow.min.js'
            '/static/js/iframe-resizer-noop.js';
    }
    location /hnang-kari-ai-asi-sluhay/ {
        proxy_pass  http://hnang-kari-ai-asi-sluhay$request_uri;
        proxy_set_header Host  $http_host;
        client_max_body_size 1G;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter
            'https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.contentWindow.min.js'
            '/static/js/iframe-resizer-noop.js';
    }
    location /kari-seejiq-tnpusu-ai-hmjil/ {
        proxy_pass  http://kari-seejiq-tnpusu-ai-hmjil$request_uri;
        proxy_set_header Host  $http_host;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter
            'https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.contentWindow.min.js'
            '/static/js/iframe-resizer-noop.js';
    }
    location /favicon.ico {
        proxy_pass  http://sapolita-kaldi$request_uri;
        proxy_set_header Host  $http_host;

        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass  http://autuan/;
        proxy_set_header Host  $http_host;
        client_max_body_size 10M;
    }
}
